<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin do catálogo | Geraldo Lira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="assets/iconify-icon.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <header class="site-header admin-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <span class="brand-mark">GL</span>
          <span>
            <strong>Geraldo Lira</strong>
            <small>Admin do catálogo</small>
          </span>
        </a>
        <div class="admin-header-actions">
          <a class="btn btn-small btn-secondary" href="/">Ver site</a>
          <button class="btn btn-small btn-dark" id="logout-button" type="button" hidden>Sair</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-login-section" id="login-view">
        <div class="admin-login-panel">
          <div class="section-label">
            <iconify-icon icon="solar:lock-keyhole-linear" width="18"></iconify-icon>
            <span>Acesso administrativo</span>
          </div>
          <h1>Entrar no painel</h1>
          <form class="admin-form" id="login-form">
            <label>
              <span>Email</span>
              <input id="login-email" type="email" autocomplete="email" required />
            </label>
            <label>
              <span>Senha</span>
              <input id="login-password" type="password" autocomplete="current-password" required />
            </label>
            <button class="btn btn-primary" type="submit">
              <span>Entrar</span>
              <iconify-icon icon="solar:arrow-right-linear" width="20"></iconify-icon>
            </button>
          </form>
          <p class="admin-message" id="login-message" role="status"></p>
        </div>
      </section>

      <section class="admin-dashboard" id="admin-view" hidden>
        <div class="container admin-shell">
          <div class="admin-title-row">
            <div>
              <div class="section-label">
                <iconify-icon icon="solar:chart-2-linear" width="18"></iconify-icon>
                <span>Painel administrativo</span>
              </div>
              <h1>Catálogo administrável</h1>
            </div>
            <div class="admin-title-actions">
              <button class="btn btn-secondary" id="export-json-button" type="button">
                <span>Exportar JSON</span>
                <iconify-icon icon="solar:download-linear" width="20"></iconify-icon>
              </button>
              <button class="btn btn-secondary" id="export-csv-button" type="button">
                <span>Exportar CSV</span>
                <iconify-icon icon="solar:file-text-linear" width="20"></iconify-icon>
              </button>
              <button class="btn btn-primary" id="new-product-button" type="button">
                <span>Novo produto</span>
                <iconify-icon icon="solar:add-circle-linear" width="20"></iconify-icon>
              </button>
            </div>
          </div>

          <p class="admin-message" id="admin-message" role="status"></p>

          <section class="admin-summary" aria-label="Resumo do catálogo">
            <article class="admin-stat-card">
              <small>Total de produtos</small>
              <strong id="stat-total-products">0</strong>
            </article>
            <article class="admin-stat-card">
              <small>Publicados</small>
              <strong id="stat-published-products">0</strong>
            </article>
            <article class="admin-stat-card">
              <small>Ocultos</small>
              <strong id="stat-hidden-products">0</strong>
            </article>
            <article class="admin-stat-card">
              <small>Categorias/filtros</small>
              <strong id="stat-taxonomies">0</strong>
            </article>
          </section>

          <section class="admin-recent-panel" aria-label="Últimos produtos criados ou editados">
            <div class="admin-list-head">
              <strong>Últimas alterações</strong>
              <span id="last-refresh-label">Ainda não carregado</span>
            </div>
            <div class="admin-recent-list" id="recent-products"></div>
          </section>

          <div class="admin-grid">
            <section class="admin-list-panel" aria-label="Produtos cadastrados">
              <div class="admin-list-head">
                <strong id="product-count">0 produtos</strong>
                <button class="admin-link-button" id="refresh-products-button" type="button">Atualizar</button>
              </div>
              <div class="admin-filters" aria-label="Busca e filtros administrativos">
                <label>
                  <span>Buscar por nome</span>
                  <input id="product-search" type="search" placeholder="Digite parte do nome" />
                </label>
                <div class="admin-field-grid">
                  <label>
                    <span>Categoria</span>
                    <select id="category-filter">
                      <option value="">Todas</option>
                    </select>
                  </label>
                  <label>
                    <span>Status</span>
                    <select id="status-filter">
                      <option value="all">Todos</option>
                      <option value="published">Publicados</option>
                      <option value="hidden">Ocultos</option>
                    </select>
                  </label>
                </div>
                <label>
                  <span>Ordenar por</span>
                  <select id="sort-filter">
                    <option value="sort_order">Ordem</option>
                    <option value="name">Nome</option>
                    <option value="updated_at">Data de edição</option>
                    <option value="created_at">Data de criação</option>
                  </select>
                </label>
              </div>
              <div class="admin-product-list" id="product-list"></div>
            </section>

            <section class="admin-editor-panel" aria-label="Editor de produto">
              <form class="admin-form" id="product-form">
                <input id="product-id" type="hidden" />
                <input id="product-image-url" type="hidden" />
                <input id="product-image-path" type="hidden" />

                <div class="admin-editor-head">
                  <h2 id="editor-title">Novo produto</h2>
                  <span class="admin-dirty-badge" id="dirty-badge" hidden>Alterações não salvas</span>
                </div>

                <label>
                  <span>Nome</span>
                  <input id="product-name" type="text" required />
                </label>

                <label>
                  <span>Descrição</span>
                  <textarea id="product-description" rows="5"></textarea>
                </label>

                <div class="admin-field-grid">
                  <label>
                    <span>Categoria</span>
                    <input id="product-category" type="text" list="category-options" placeholder="Selecione ou digite uma nova" />
                  </label>
                  <label>
                    <span>Filtro</span>
                    <input id="product-filter" type="text" list="filter-options" placeholder="Selecione ou digite um novo" />
                  </label>
                </div>
                <datalist id="category-options"></datalist>
                <datalist id="filter-options"></datalist>

                <div class="admin-field-grid">
                  <label>
                    <span>Ordem</span>
                    <input id="product-sort-order" type="number" min="0" step="1" value="0" />
                  </label>
                  <label class="admin-check">
                    <input id="product-is-published" type="checkbox" checked />
                    <span>Publicado no site</span>
                  </label>
                </div>

                <label class="admin-check">
                  <input id="product-is-featured" type="checkbox" />
                  <span>Destacar produto no admin</span>
                </label>

                <label>
                  <span>Imagem</span>
                  <input id="product-image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
                </label>

                <div class="admin-image-preview" id="image-preview">
                  <span>Sem imagem</span>
                </div>

                <div class="admin-form-actions">
                  <button class="btn btn-primary" type="submit">
                    <span>Salvar produto</span>
                    <iconify-icon icon="solar:diskette-linear" width="20"></iconify-icon>
                  </button>
                  <button class="btn btn-secondary" id="cancel-edit-button" type="button">Cancelar/voltar</button>
                  <button class="btn btn-secondary" id="clear-image-selection-button" type="button">Limpar seleção de imagem</button>
                  <button class="btn btn-secondary" id="toggle-publish-button" type="button">Ocultar do site</button>
                </div>
              </form>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      const apiBaseUrl = import.meta.env.VITE_API_BASE_URL || "";
      const loginView = document.querySelector("#login-view");
      const adminView = document.querySelector("#admin-view");
      const loginForm = document.querySelector("#login-form");
      const productForm = document.querySelector("#product-form");
      const productList = document.querySelector("#product-list");
      const logoutButton = document.querySelector("#logout-button");
      const loginMessage = document.querySelector("#login-message");
      const adminMessage = document.querySelector("#admin-message");
      const productCount = document.querySelector("#product-count");
      const imagePreview = document.querySelector("#image-preview");
      const recentProducts = document.querySelector("#recent-products");
      const lastRefreshLabel = document.querySelector("#last-refresh-label");
      const dirtyBadge = document.querySelector("#dirty-badge");
      const togglePublishButton = document.querySelector("#toggle-publish-button");
      const filterControls = {
        search: document.querySelector("#product-search"),
        category: document.querySelector("#category-filter"),
        status: document.querySelector("#status-filter"),
        sort: document.querySelector("#sort-filter"),
      };
      const stats = {
        total: document.querySelector("#stat-total-products"),
        published: document.querySelector("#stat-published-products"),
        hidden: document.querySelector("#stat-hidden-products"),
        taxonomies: document.querySelector("#stat-taxonomies"),
      };
      let products = [];
      let authToken = "";
      let formSnapshot = "";
      let isFormDirty = false;

      const fields = {
        id: document.querySelector("#product-id"),
        name: document.querySelector("#product-name"),
        description: document.querySelector("#product-description"),
        category: document.querySelector("#product-category"),
        filter: document.querySelector("#product-filter"),
        sortOrder: document.querySelector("#product-sort-order"),
        isPublished: document.querySelector("#product-is-published"),
        isFeatured: document.querySelector("#product-is-featured"),
        imageFile: document.querySelector("#product-image-file"),
        imageUrl: document.querySelector("#product-image-url"),
        imagePath: document.querySelector("#product-image-path"),
      };

      const allowedImageTypes = new Set(["image/jpeg", "image/png", "image/webp", "image/gif"]);

      function setMessage(target, message, type = "") {
        target.textContent = message || "";
        target.dataset.type = type;
      }

      function slugify(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 80);
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
      }

      function normalizeText(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function imagePreviewUrl(url) {
        if (!url) return "";
        if (/^https?:\/\//i.test(url)) return url;
        if (apiBaseUrl && url.startsWith("/uploads/")) return `${apiBaseUrl}${url}`;
        return url;
      }

      function formatDate(value) {
        if (!value) return "Sem data";
        return new Intl.DateTimeFormat("pt-BR", {
          dateStyle: "short",
          timeStyle: "short",
        }).format(new Date(value));
      }

      function productStatusLabel(product) {
        return product.is_published ? "Publicado no site" : "Oculto do site";
      }

      function currentFormSnapshot() {
        return JSON.stringify({
          id: fields.id.value,
          name: fields.name.value,
          description: fields.description.value,
          category: fields.category.value,
          filter: fields.filter.value,
          sortOrder: fields.sortOrder.value,
          isPublished: fields.isPublished.checked,
          isFeatured: fields.isFeatured.checked,
          imageUrl: fields.imageUrl.value,
          imagePath: fields.imagePath.value,
          imageFile: fields.imageFile.value,
        });
      }

      function markFormClean() {
        formSnapshot = currentFormSnapshot();
        isFormDirty = false;
        dirtyBadge.hidden = true;
      }

      function updateDirtyState() {
        isFormDirty = currentFormSnapshot() !== formSnapshot;
        dirtyBadge.hidden = !isFormDirty;
      }

      function confirmDiscardChanges() {
        return !isFormDirty || window.confirm("Existem alterações não salvas. Deseja descartá-las?");
      }

      function handleExpiredSession(message = "Sua sessão expirou. Entre novamente para continuar.") {
        authToken = "";
        showLoginView();
        setMessage(loginMessage, message, "error");
      }

      async function apiRequest(path, options = {}) {
        const headers = new Headers(options.headers || {});
        headers.set("Accept", "application/json");

        if (authToken) {
          headers.set("Authorization", `Bearer ${authToken}`);
        }

        if (options.body && !(options.body instanceof FormData)) {
          headers.set("Content-Type", "application/json");
        }

        const response = await fetch(`${apiBaseUrl}${path}`, {
          ...options,
          headers,
        });

        const data = await response.json().catch(() => null);
        if (!response.ok) {
          if (response.status === 401 && authToken) {
            handleExpiredSession();
          }
          throw new Error(data?.error || `Erro ${response.status}`);
        }

        return data;
      }

      function showAdminView() {
        loginView.hidden = true;
        adminView.hidden = false;
        logoutButton.hidden = false;
      }

      function showLoginView() {
        loginView.hidden = false;
        adminView.hidden = true;
        logoutButton.hidden = true;
      }

      function updateImagePreview(url) {
        if (!url) {
          imagePreview.innerHTML = "<span>Sem imagem</span>";
          return;
        }

        imagePreview.innerHTML = `<img src="${escapeHtml(imagePreviewUrl(url))}" alt="Preview da imagem do produto" />`;
      }

      function resetForm(force = false) {
        if (!force && isFormDirty && !confirmDiscardChanges()) return;
        productForm.reset();
        fields.id.value = "";
        fields.imageUrl.value = "";
        fields.imagePath.value = "";
        fields.sortOrder.value = "0";
        fields.isPublished.checked = true;
        fields.isFeatured.checked = false;
        document.querySelector("#editor-title").textContent = "Novo produto";
        updateImagePreview("");
        togglePublishButton.textContent = "Ocultar do site";
        markFormClean();
      }

      function fillForm(product, force = false) {
        if (!force && isFormDirty && !confirmDiscardChanges()) return;
        fields.id.value = product.id;
        fields.name.value = product.name || "";
        fields.description.value = product.description || "";
        fields.category.value = product.category || "";
        fields.filter.value = product.filter || "";
        fields.sortOrder.value = product.sort_order || 0;
        fields.isPublished.checked = Boolean(product.is_published);
        fields.isFeatured.checked = Boolean(product.is_featured);
        fields.imageUrl.value = product.image_url || "";
        fields.imagePath.value = product.image_path || "";
        fields.imageFile.value = "";
        document.querySelector("#editor-title").textContent = "Editar produto";
        togglePublishButton.textContent = product.is_published ? "Ocultar do site" : "Publicar no site";
        updateImagePreview(product.image_url || "");
        markFormClean();
      }

      function uniqueValues(key) {
        return [...new Set(products.map((product) => product[key]).filter(Boolean))]
          .sort((a, b) => String(a).localeCompare(String(b), "pt-BR"));
      }

      function refreshTaxonomyOptions() {
        const categories = uniqueValues("category");
        const filters = uniqueValues("filter");
        const currentFilterValue = filterControls.category.value;
        filterControls.category.innerHTML = [
          '<option value="">Todas</option>',
          ...categories.map((category) => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`),
        ].join("");
        filterControls.category.value = categories.includes(currentFilterValue) ? currentFilterValue : "";

        document.querySelector("#category-options").innerHTML = categories
          .map((category) => `<option value="${escapeHtml(category)}"></option>`)
          .join("");
        document.querySelector("#filter-options").innerHTML = filters
          .map((filter) => `<option value="${escapeHtml(filter)}"></option>`)
          .join("");
      }

      function filteredProducts() {
        const query = normalizeText(filterControls.search.value.trim());
        const category = filterControls.category.value;
        const status = filterControls.status.value;
        const sortBy = filterControls.sort.value;

        return products
          .filter((product) => {
            const matchesName = !query || normalizeText(product.name).includes(query);
            const matchesCategory = !category || product.category === category;
            const matchesStatus =
              status === "all" ||
              (status === "published" && product.is_published) ||
              (status === "hidden" && !product.is_published);
            return matchesName && matchesCategory && matchesStatus;
          })
          .sort((a, b) => {
            if (sortBy === "name") return String(a.name || "").localeCompare(String(b.name || ""), "pt-BR");
            if (sortBy === "updated_at" || sortBy === "created_at") {
              return new Date(b[sortBy] || 0) - new Date(a[sortBy] || 0);
            }
            return Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
              String(a.name || "").localeCompare(String(b.name || ""), "pt-BR");
          });
      }

      function renderDashboard() {
        const published = products.filter((product) => product.is_published).length;
        const hidden = products.length - published;
        const taxonomyTotal = new Set([
          ...products.map((product) => product.category).filter(Boolean),
          ...products.map((product) => product.filter).filter(Boolean),
        ]).size;
        stats.total.textContent = products.length;
        stats.published.textContent = published;
        stats.hidden.textContent = hidden;
        stats.taxonomies.textContent = taxonomyTotal;

        const recent = [...products]
          .sort((a, b) => new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0))
          .slice(0, 5);

        recentProducts.innerHTML = recent.length
          ? recent.map((product) => `
              <button class="admin-recent-item" type="button" data-product-id="${escapeHtml(product.id)}">
                <strong>${escapeHtml(product.name)}</strong>
                <span>${escapeHtml(productStatusLabel(product))} · ${escapeHtml(formatDate(product.updated_at || product.created_at))}</span>
              </button>
            `).join("")
          : '<p class="admin-empty-list">Nenhuma alteração recente.</p>';
      }

      function renderProductList() {
        const visibleProducts = filteredProducts();
        productCount.textContent = `${visibleProducts.length} de ${products.length} ${products.length === 1 ? "produto" : "produtos"}`;

        if (!visibleProducts.length) {
          productList.innerHTML = '<p class="admin-empty-list">Nenhum produto encontrado com estes filtros.</p>';
          return;
        }

        productList.innerHTML = visibleProducts.map((product) => `
          <div class="admin-product-row" role="button" tabindex="0" data-product-id="${escapeHtml(product.id)}">
            <span class="admin-row-thumb">
              ${product.image_url ? `<img src="${escapeHtml(imagePreviewUrl(product.image_url))}" alt="" />` : "<iconify-icon icon=\"solar:box-linear\" width=\"22\"></iconify-icon>"}
            </span>
            <span class="admin-row-main">
              <strong>${escapeHtml(product.name)}</strong>
              <small>${escapeHtml(product.category || "Sem categoria")} · ${escapeHtml(productStatusLabel(product))}${product.is_featured ? " · Destaque" : ""}</small>
            </span>
            <span class="admin-row-order">
              <small>Ordem</small>
              <input class="admin-order-input" type="number" min="0" step="1" value="${Number(product.sort_order || 0)}" data-order-product-id="${escapeHtml(product.id)}" aria-label="Ordem de ${escapeHtml(product.name)}" />
            </span>
          </div>
        `).join("");
      }

      async function loadProducts() {
        products = await apiRequest("/api/admin/products");
        refreshTaxonomyOptions();
        renderDashboard();
        renderProductList();
        lastRefreshLabel.textContent = `Atualizado em ${formatDate(new Date().toISOString())}`;
      }

      async function uploadImage(productId, file) {
        if (!allowedImageTypes.has(file.type)) {
          throw new Error("Envie uma imagem JPG, PNG, WEBP ou GIF.");
        }

        const formData = new FormData();
        formData.append("image", file);
        return apiRequest(`/api/admin/products/${productId}/image`, {
          method: "POST",
          body: formData,
        });
      }

      async function saveProduct(event) {
        event.preventDefault();
        setMessage(adminMessage, "Salvando produto...");

        try {
          const existingId = fields.id.value;
          const payload = {
            name: fields.name.value.trim(),
            description: fields.description.value.trim(),
            category: fields.category.value.trim(),
            filter: fields.filter.value.trim(),
            is_published: fields.isPublished.checked,
            is_featured: fields.isFeatured.checked,
            sort_order: Number(fields.sortOrder.value || 0),
          };

          let product = await apiRequest(
            existingId ? `/api/admin/products/${existingId}` : "/api/admin/products",
            {
              method: existingId ? "PUT" : "POST",
              body: JSON.stringify(payload),
            },
          );

          if (fields.imageFile.files[0]) {
            product = await uploadImage(product.id, fields.imageFile.files[0]);
          }

          setMessage(adminMessage, "Produto salvo com sucesso.", "success");
          await loadProducts();
          fillForm(product, true);
        } catch (error) {
          setMessage(adminMessage, error.message || "Não foi possível salvar o produto. Revise os campos e tente novamente.", "error");
        }
      }

      async function togglePublishState() {
        if (!fields.id.value) return;
        if (isFormDirty && !confirmDiscardChanges()) return;
        try {
          const currentProduct = products.find((item) => item.id === fields.id.value);
          const nextState = !Boolean(currentProduct?.is_published);
          const product = await apiRequest(`/api/admin/products/${fields.id.value}/publish`, {
            method: "PATCH",
            body: JSON.stringify({ is_published: nextState }),
          });
          setMessage(adminMessage, nextState ? "Produto publicado no site." : "Produto oculto do site.", "success");
          await loadProducts();
          fillForm(product, true);
        } catch (error) {
          setMessage(adminMessage, error.message, "error");
        }
      }

      async function updateProductOrder(productId, sortOrder) {
        const product = products.find((item) => item.id === productId);
        if (!product) return;
        try {
          const updated = await apiRequest(`/api/admin/products/${productId}`, {
            method: "PUT",
            body: JSON.stringify({
              name: product.name,
              description: product.description || "",
              category: product.category || "",
              filter: product.filter || "",
              is_published: Boolean(product.is_published),
              is_featured: Boolean(product.is_featured),
              sort_order: Number(sortOrder || 0),
            }),
          });
          setMessage(adminMessage, "Ordem atualizada.", "success");
          await loadProducts();
          if (fields.id.value === productId) fillForm(updated, true);
        } catch (error) {
          setMessage(adminMessage, error.message, "error");
          renderProductList();
        }
      }

      function clearImageSelection() {
        fields.imageFile.value = "";
        updateImagePreview(fields.imageUrl.value);
        updateDirtyState();
        setMessage(adminMessage, "Seleção de imagem limpa. A imagem cadastrada foi mantida.", "success");
      }

      function exportProducts(format) {
        if (!products.length) {
          setMessage(adminMessage, "Não há produtos para exportar.", "error");
          return;
        }

        const filename = `produtos-catalogo-${new Date().toISOString().slice(0, 10)}.${format}`;
        let content = "";
        let type = "application/json;charset=utf-8";

        if (format === "json") {
          content = JSON.stringify(products, null, 2);
        } else {
          type = "text/csv;charset=utf-8";
          const columns = ["id", "name", "slug", "description", "category", "filter", "image_url", "is_published", "is_featured", "sort_order", "created_at", "updated_at"];
          const escapeCsv = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
          content = [
            columns.join(","),
            ...products.map((product) => columns.map((column) => escapeCsv(product[column])).join(",")),
          ].join("\n");
        }

        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
        setMessage(adminMessage, `Exportação ${format.toUpperCase()} gerada.`, "success");
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setMessage(loginMessage, "Entrando...");

        try {
          const data = await apiRequest("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
              email: document.querySelector("#login-email").value.trim(),
              password: document.querySelector("#login-password").value,
            }),
          });

          authToken = data.token;
          showAdminView();
          setMessage(loginMessage, "");
          productForm.reset();
          markFormClean();
          resetForm(true);
          await loadProducts();
        } catch (error) {
          setMessage(loginMessage, error.message, "error");
        }
      });

      logoutButton.addEventListener("click", () => {
        if (isFormDirty && !confirmDiscardChanges()) return;
        authToken = "";
        showLoginView();
        setMessage(loginMessage, "Você saiu do painel com segurança.", "success");
      });

      productForm.addEventListener("submit", saveProduct);
      productForm.addEventListener("input", updateDirtyState);
      productForm.addEventListener("change", updateDirtyState);
      document.querySelector("#new-product-button").addEventListener("click", resetForm);
      document.querySelector("#refresh-products-button").addEventListener("click", loadProducts);
      document.querySelector("#toggle-publish-button").addEventListener("click", togglePublishState);
      document.querySelector("#cancel-edit-button").addEventListener("click", resetForm);
      document.querySelector("#clear-image-selection-button").addEventListener("click", clearImageSelection);
      document.querySelector("#export-json-button").addEventListener("click", () => exportProducts("json"));
      document.querySelector("#export-csv-button").addEventListener("click", () => exportProducts("csv"));

      Object.values(filterControls).forEach((control) => {
        control.addEventListener("input", renderProductList);
        control.addEventListener("change", renderProductList);
      });

      fields.imageFile.addEventListener("change", () => {
        const file = fields.imageFile.files[0];
        if (!file) {
          updateImagePreview(fields.imageUrl.value);
          return;
        }
        if (!allowedImageTypes.has(file.type)) {
          fields.imageFile.value = "";
          updateImagePreview(fields.imageUrl.value);
          setMessage(adminMessage, "Envie uma imagem JPG, PNG, WEBP ou GIF.", "error");
          updateDirtyState();
          return;
        }
        updateImagePreview(URL.createObjectURL(file));
        updateDirtyState();
      });

      productList.addEventListener("click", (event) => {
        if (event.target.closest("[data-order-product-id]")) return;
        const row = event.target.closest("[data-product-id]");
        if (!row) return;
        const product = products.find((item) => item.id === row.dataset.productId);
        if (product) fillForm(product);
      });

      productList.addEventListener("keydown", (event) => {
        if (!["Enter", " "].includes(event.key)) return;
        if (event.target.closest("[data-order-product-id]")) return;
        const row = event.target.closest("[data-product-id]");
        if (!row) return;
        event.preventDefault();
        const product = products.find((item) => item.id === row.dataset.productId);
        if (product) fillForm(product);
      });

      productList.addEventListener("change", (event) => {
        const input = event.target.closest("[data-order-product-id]");
        if (!input) return;
        updateProductOrder(input.dataset.orderProductId, input.value);
      });

      recentProducts.addEventListener("click", (event) => {
        const row = event.target.closest("[data-product-id]");
        if (!row) return;
        const product = products.find((item) => item.id === row.dataset.productId);
        if (product) fillForm(product);
      });

      window.addEventListener("beforeunload", (event) => {
        if (!isFormDirty) return;
        event.preventDefault();
        event.returnValue = "";
      });

      showLoginView();
      markFormClean();
    </script>
  </body>
</html>
